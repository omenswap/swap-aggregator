listen = ":8000"
cache_ttl = "30s"

# every key is optional; unset keys keep the built-in black and white theme
[theme]
background = "#000000"
text = "#ffffff"
muted = "#999999"
faint = "#666666"
border = "#333333"
border_hover = "#666666"
row_hover = "#111111"
font = "ui-monospace, Menlo, Consolas, monospace"
color_scheme = "dark"

# rate_limit is outbound requests per second per provider (0 = unlimited),
# rate_burst is how many may go out back-to-back before pacing kicks in
[[providers]]
name = "omenswap"
type = "omenswap"
url = "https://omenswap.com"
enabled = true
affiliate_code = ""

# affiliate_fee_percent is stealthex additional_fee_percent (0-20); floating rate only
# rate limit: 600 req/min
[[providers]]
name = "stealthex"
type = "stealthex"
url = "https://api.stealthex.io"
enabled = true
api_key = ""
affiliate_code = ""
affiliate_fee_percent = 0
rate_limit = 0.3
rate_burst = 3

# partner commission is bound to the api key in the simpleswap dashboard
# rate limit: 50 req / 10s, then a 1 minute ip ban
[[providers]]
name = "simpleswap"
type = "simpleswap"
url = "https://api.simpleswap.io"
enabled = true
api_key = ""
rate_limit = 1.0
rate_burst = 3

# affiliate_code is the refcode; affiliate_fee_percent is afftax (needs a refcode)
# rate limit: 250 weight/min, and creating a swap costs 50
[[providers]]
name = "fixedfloat"
type = "fixedfloat"
url = "https://ff.io"
enabled = true
# fixedfloat api_key is "key:secret"
api_key = ""
affiliate_fee_percent = 0
rate_limit = 1.0
rate_burst = 3

# the referral share is earned by api_key; affiliate_code is used if api_key is empty
[[providers]]
name = "wizardswap"
type = "wizardswap"
url = "https://www.wizardswap.io"
enabled = true
api_key = ""
affiliate_code = ""
# no documented rate limit; abusive ips are banned, so stay gentle
rate_limit = 0.5
rate_burst = 2

# affiliate_code is the referrer; affiliate_fee_percent becomes markupRate (max 10%)
[[providers]]
name = "bitcoinvn"
type = "bitcoinvn"
url = "https://bitcoinvn.io"
enabled = true
api_key = ""
affiliate_code = ""
affiliate_fee_percent = 0
# no documented rate limit; abusive ips are banned, so stay gentle
rate_limit = 0.5
rate_burst = 2

# affiliate_code is the affiliateToken
[[providers]]
name = "etzswap"
type = "etzswap"
url = "https://api.etz-swap.com"
enabled = true
# etzswap api_key is "public:secret"
api_key = ""
affiliate_code = ""
# no documented rate limit; abusive ips are banned, so stay gentle
rate_limit = 0.5
rate_burst = 2
