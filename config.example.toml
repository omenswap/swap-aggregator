listen = ":8000"
cache_ttl = "30s"

# every key is optional; unset keys keep the built-in black and white theme
[theme]
background = "#000000"
text = "#ffffff"
muted = "#999999"
faint = "#666666"
border = "#333333"
border_hover = "#666666"
row_hover = "#111111"
font = "ui-monospace, Menlo, Consolas, monospace"
color_scheme = "dark"

# rate_limit is outbound requests per second per provider (0 = unlimited),
# rate_burst is how many may go out back-to-back before pacing kicks in
[[providers]]
name = "omenswap"
type = "omenswap"
url = "https://omenswap.com"
enabled = true
affiliate_code = ""

[[providers]]
name = "stealthex"
type = "stealthex"
url = "https://api.stealthex.io"
enabled = true
api_key = ""
# affiliate_code is stealthex additional_fee_percent, numeric e.g. "0.5"
affiliate_code = ""
rate_limit = 0.3
rate_burst = 3

[[providers]]
name = "simpleswap"
type = "simpleswap"
url = "https://api.simpleswap.io"
enabled = true
api_key = ""
rate_limit = 1.0
rate_burst = 3

[[providers]]
name = "fixedfloat"
type = "fixedfloat"
url = "https://ff.io"
enabled = true
# fixedfloat api_key is "key:secret"
api_key = ""
rate_limit = 1.0
rate_burst = 3

[[providers]]
name = "wizardswap"
type = "wizardswap"
url = "https://www.wizardswap.io"
enabled = true
api_key = ""
affiliate_code = ""
rate_limit = 2.0
rate_burst = 4

[[providers]]
name = "bitcoinvn"
type = "bitcoinvn"
url = "https://bitcoinvn.io"
enabled = true
api_key = ""
affiliate_code = ""
rate_limit = 2.0
rate_burst = 4

[[providers]]
name = "etzswap"
type = "etzswap"
url = "https://api.etz-swap.com"
enabled = true
# etzswap api_key is "public:secret"
api_key = ""
affiliate_code = ""
rate_limit = 2.0
rate_burst = 4
